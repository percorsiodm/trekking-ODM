<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percorsi Trekking - Percorsi ODM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background-image: linear-gradient(rgba(20,30,15,0.4), rgba(20,30,15,0.6)), url('Trekking_1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #f5f2e8;
    }
    .home-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
    .home-btn img {
      width: 70px;
      height: auto;
      display: block;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .home-btn img:hover {
      transform: scale(1.05);
    }
    .header {
      text-align: center;
      padding: 90px 20px 15px;
    }
    .header h1 {
      margin: 0;
      font-size: 1.7rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    .header p {
      margin-top: 6px;
      font-size: 0.9rem;
      opacity: 0.95;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
    }
    .list-wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 20px 40px;
      box-sizing: border-box;
      text-align: center;
    }
    .empty-msg {
      background: transparent;
      color: #f5f2e8;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-weight: bold;
      font-size: 0.95rem;
      padding: 18px 24px;
      border-radius: 16px;
      border: 2px dashed rgba(217, 176, 79, 0.9);
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .back-link:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      body { background-attachment: scroll; }
      .home-btn { top: 10px; right: 10px; }
      .home-btn img { width: 55px; }
      .header { padding: 75px 15px 10px; }
      .header h1 { font-size: 1.4rem; }
      .empty-msg { font-size: 0.85rem; padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn">
    <img src="Trekking.jpg" alt="Torna alla Home">
  </a>

  <div class="header">
    <h1>Percorsi Trekking</h1>
    <p>Mappe interattive dei sentieri escursionistici</p>
  </div>

  <div class="list-wrap">
    <div class="empty-msg">
      🌿 Al momento non ci sono percorsi trekking disponibili
    </div>
    <a href="mappe.html" class="back-link">← Torna alla scelta del tipo di percorso</a>
  </div>
</body>
</html>
