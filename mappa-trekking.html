<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percorsi Trekking - Percorsi ODM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background-image: linear-gradient(rgba(20,30,15,0.4), rgba(20,30,15,0.6)), url('Trekking_1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #f5f2e8;
    }
    .home-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
    .home-btn img {
      width: 70px;
      height: auto;
      display: block;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .home-btn img:hover {
      transform: scale(1.05);
    }
    .header {
      text-align: center;
      padding: 90px 20px 15px;
    }
    .header h1 {
      margin: 0;
      font-size: 1.7rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    .header p {
      margin-top: 6px;
      font-size: 0.9rem;
      opacity: 0.95;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
    }
    .list-wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px 20px;
      box-sizing: border-box;
    }
    .route-card {
      display: block;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid rgba(173, 216, 230, 0.8);
      border-radius: 12px;
      padding: 10px 18px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.3s ease;
    }
    .route-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(173, 216, 230, 1);
    }
    .route-card h2 {
      margin: 0 0 2px;
      color: #fff;
      font-size: 1rem;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .route-card p {
      margin: 0;
      font-size: 0.8rem;
      opacity: 0.9;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    }
    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .back-link:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      body { background-attachment: scroll; }
      .home-btn { top: 10px; right: 10px; }
      .home-btn img { width: 55px; }
      .header { padding: 75px 15px 10px; }
      .header h1 { font-size: 1.4rem; }
      .route-card { padding: 8px 14px; }
      .route-card h2 { font-size: 0.9rem; }
      .route-card p { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn">
    <img src="Trekking.jpg" alt="Torna alla Home">
  </a>

  <div class="header">
    <h1>Percorsi Trekking</h1>
    <p>Mappe interattive dei sentieri escursionistici</p>
  </div>

  <div class="list-wrap">
    <a href="sentiero-degli-dei.html" class="route-card">
      <h2>Sentiero degli Dei</h2>
      <p>130 km tra Bologna e Firenze, lungo l'antico crinale appenninico</p>
    </a>

    <a href="mappe.html" class="back-link">← Torna alla scelta del tipo di percorso</a>
  </div>
</body>
</html>
