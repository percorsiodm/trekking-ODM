<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Via degli Dei</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #1c2414;
        font-family: sans-serif;
        color: #fff;
        padding: 40px 20px;
        text-align: center;
    }
    h1 { margin-bottom: 30px; }
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
    }
    .gallery-grid img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .back-btn {
        display: inline-block;
        margin-top: 40px;
        color: #fff;
        text-decoration: none;
        background: #4a5c2f;
        padding: 12px 24px;
        border-radius: 30px;
    }
</style>
</head>
<body>
    <h1>Gallery - Via degli Dei</h1>
    <div class="gallery-grid">
        <img src="Viadeglidei.jpg" alt="Via degli Dei">
        <img src="Via%20degli%20dei%20Dei.png" alt="Via degli Dei">
    </div>
    <a href="viadeglidei.html" class="back-btn">← Torna al Cammino degli Dei</a>
</body>
</html>
