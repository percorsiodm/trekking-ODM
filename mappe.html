<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappe Interattive - Percorsi ODM</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('Ortona_2.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .home-btn img {
            width: 70px;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .home-btn img:hover {
            transform: scale(1.05);
        }
        .center-content {
            text-align: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .center-content h1 {
            display: inline-block;
            background: rgba(0,0,0,0.45);
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.6rem;
            padding: 14px 26px;
            border-radius: 10px;
            margin: 0 0 25px;
        }
        .map-type-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .map-type-btn {
            display: inline-block;
            padding: 14px 30px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .map-type-btn:hover {
            background-color: #256628;
            transform: translateY(-3px);
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
            .home-btn {
                top: 10px;
                right: 10px;
            }
            .home-btn img {
                width: 55px;
            }
            .center-content h1 {
                font-size: 1.2rem;
                padding: 10px 18px;
            }
            .map-type-btn {
                padding: 12px 22px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">
        <img src="Trekking.jpg" alt="Torna alla Home">
    </a>
    <div class="center-content">
        <h1>Scegli la tipologia di percorso</h1>
        <div class="map-type-btns">
            <a href="mappa-trekking.html" class="map-type-btn">Trekking</a>
            <a href="mappa-mtb.html" class="map-type-btn">Mountain Bike</a>
        </div>
    </div>
</body>
</html>
