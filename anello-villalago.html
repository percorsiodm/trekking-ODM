<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anello di Villalago - Percorsi ODM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background-image: linear-gradient(rgba(20,30,15,0.35), rgba(20,30,15,0.55)), url('Anello%20Di%20Villalago.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #f5f2e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .top-right {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .top-right img {
      width: 70px;
      height: auto;
      display: block;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .top-right img:hover {
      transform: scale(1.05);
    }
    .mtb-back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      display: inline-block;
      background-color: #2e7d32;
      color: white;
      text-decoration: none;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: bold;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .mtb-back-link:hover {
      background-color: #256628;
      transform: translateY(-2px);
    }
    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin: 0 0 8px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    .subtitle {
      text-align: center;
      font-size: 1.05rem;
      opacity: 0.95;
      margin: 0 0 40px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
    }
    .menu-btns {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 380px;
    }
    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 16px 26px;
      border-radius: 50px;
      border: 1.5px solid rgba(173, 216, 230, 0.8);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
      transition: background 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(173, 216, 230, 1);
      transform: translateY(-3px);
    }
    .menu-btn .icon {
      font-size: 1.3rem;
    }
    @media (max-width: 768px) {
      body { background-attachment: scroll; padding: 30px 15px; }
      .top-right { top: 10px; right: 10px; gap: 8px; }
      .top-right img { width: 55px; }
      .mtb-back-link {
        top: 10px;
        left: 10px;
        font-size: 0.8rem;
        padding: 8px 14px;
      }
      h1 { font-size: 1.9rem; }
      .subtitle { font-size: 0.95rem; }
      .menu-btn { font-size: 1rem; padding: 14px 20px; }
    }
  </style>
</head>
