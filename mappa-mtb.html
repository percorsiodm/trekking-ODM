<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percorsi Mountain Bike - Percorsi ODM</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: linear-gradient(rgba(20,30,15,0.75), rgba(20,30,15,0));
      padding: 18px 20px 40px;
      pointer-events: none;
      text-align: center;
    }
    .top-bar h1 {
      color: #fff;
      margin: 0 0 4px;
      font-size: 1.5rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    .top-bar p {
      color: #f5f2e8;
      margin: 0;
      font-size: 0.9rem;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
    }
    .back-link {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1001;
      pointer-events: auto;
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      text-decoration: none;
      font-weight: normal;
      font-size: 0.85rem;
      padding: 9px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(173, 216, 230, 0.8);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .back-link:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(173, 216, 230, 1);
    }
    .popup-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #333;
    }
    .popup-route-list a {
      display: block;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      padding: 5px 0;
      border-bottom: 1px solid rgba(51,51,51,0.15);
    }
    .popup-route-list a:last-child {
      border-bottom: none;
    }
    .popup-route-list a:hover {
      color: #2e7d32;
    }
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1.5px solid rgba(173, 216, 230, 0.8);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(173, 216, 230, 0.8);
    }
    .custom-pin {
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
    }
    .pulse-ring {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(46, 125, 50, 0.5);
      animation: pulse-anim 1.8s ease-out infinite;
    }
    @keyframes pulse-anim {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .hint-tooltip {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      color: #2c2416;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .hint-tooltip::before {
      border-right-color: rgba(255, 255, 255, 0.9);
    }
    @media (max-width: 768px) {
      .top-bar h1 { font-size: 1.2rem; }
      .top-bar p { font-size: 0.8rem; }
      .back-link { font-size: 0.75rem; padding: 7px 12px; top: 10px; right: 10px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>Percorsi Mountain Bike</h1>
  <p>Scegli un punto sulla mappa per scoprire i percorsi</p>
</div>

<a href="mappe.html" class="back-link">← Torna alla scelta del tipo di percorso</a>

<div id="map"></div>

<script>
    var map = L.map('map').setView([42.3, 12.6], 6);

    L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors, Style: &copy; CyclOSM',
        maxZoom: 20
    }).addTo(map);

    // Anello pulsante dietro al marker, per farlo notare
    var pulseIcon = L.divIcon({
        html: '<span class="pulse-ring"></span>',
        className: '',
        iconSize: [36, 36],
        iconAnchor: [18, 18]
    });
    L.marker([41.985, 13.730], { icon: pulseIcon, interactive: false, zIndexOffset: -10 }).addTo(map);

    var pinSvg = `
        <svg width="36" height="48" viewBox="0 0 36 48" xmlns="http://www.w3.org/2000/svg" class="custom-pin">
            <path d="M18 0C8 0 0 8 0 18c0 13 18 30 18 30s18-17 18-30C36 8 28 0 18 0z" fill="#2e7d32"/>
            <circle cx="18" cy="18" r="12" fill="#ffffff"/>
            <path d="M9 23 L14 14 L18 20 L21 15 L27 23 Z" fill="#2e7d32"/>
        </svg>
    `;

    var customIcon = L.divIcon({
        html: pinSvg,
        className: '',
        iconSize: [36, 48],
        iconAnchor: [18, 48],
        popupAnchor: [0, -44]
    });

    var marsicaMarker = L.marker([41.985, 13.730], { icon: customIcon }).addTo(map);

    // Suggerimento sempre visibile finché non si clicca
    marsicaMarker.bindTooltip('👉 Tocca qui per vedere i percorsi', {
        permanent: true,
        direction: 'right',
        offset: [10, -30],
        className: 'hint-tooltip'
    });

    var popupContent = `
        <div style="min-width: 210px;">
            <div class="popup-title">🚵 Marsica - Ortona dei Marsi</div>
            <p style="font-family:'Quicksand', sans-serif; font-size:0.85rem; color:#555; margin: 4px 0 8px;">Scegli uno dei percorsi in mountain bike disponibili in questa zona:</p>
            <div class="popup-route-list">
                <a href="mappa-anello-faito.html">Anello Monte Faito</a>
                <a href="anello-villalago.html">Anello di Villalago</a>
                <a href="milonia.html">Milonia</a>
                <a href="anello-sperone.html">Anello Sperone</a>
                <a href="fosso-san-giorgio.html">Anello Fosso San Giorgio</a>
            </div>
        </div>
    `;

    marsicaMarker.bindPopup(popupContent);

    // Al click sul marker, il suggerimento sparisce (non serve più)
    marsicaMarker.on('click', function() {
        marsicaMarker.unbindTooltip();
    });

    setTimeout(function() {
        map.flyTo([41.985, 13.730], 11, { duration: 2 });
    }, 1200);
</script>
</body>
</html>
