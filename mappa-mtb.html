<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percorsi Mountain Bike - Percorsi ODM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: linear-gradient(rgba(20,30,15,0.75), rgba(20,30,15,0));
      padding: 18px 20px 40px;
      pointer-events: none;
      text-align: center;
    }
    .top-bar h1 {
      color: #fff;
      margin: 0 0 4px;
      font-size: 1.5rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    .top-bar p {
      color: #f5f2e8;
      margin: 0;
      font-size: 0.9rem;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
    }
    .home-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1001;
      pointer-events: auto;
    }
    .home-btn img {
      width: 55px;
      height: auto;
      display: block;
      cursor: pointer;
      transition: transform 0.2s ease;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .home-btn img:hover {
      transform: scale(1.05);
    }
    .back-link {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1001;
      pointer-events: auto;
      display: inline-block;
      background: rgba(255,255,255,0.9);
      color: #2c2416;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .back-link:hover {
      background: #fff;
    }
    .popup-route-list a {
      display: block;
      color: #2e7d32;
      font-weight: bold;
      text-decoration: none;
      padding: 5px 0;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .popup-route-list a:last-child {
      border-bottom: none;
    }
    .popup-route-list a:hover {
      text-decoration: underline;
    }
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.85);
    }
    @media (max-width: 768px) {
      .top-bar h1 { font-size: 1.2rem; }
      .top-bar p { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>Percorsi Mountain Bike</h1>
  <p>Scegli un punto sulla mappa per scoprire i percorsi</p>
</div>

<a href="mappe.html" class="back-link">← Torna alla scelta del tipo di percorso</a>
<a href="index.html" class="home-btn">
    <img src="Trekking.jpg" alt="Torna alla Home">
</a>

<div id="map"></div>

<script>
    var map = L.map('map').setView([42.3, 12.6], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marsicaMarker = L.marker([41.985, 13.730]).addTo(map);

    var popupContent = `
        <div style="font-family: Georgia, serif; min-width: 200px;">
            <strong style="font-size: 1.05rem; color: #2e7d32;">Marsica - Ortona dei Marsi (AQ)</strong>
            <div class="popup-route-list" style="margin-top: 8px;">
                <a href="mappa-anello-faito.html">Anello Monte Faito</a>
                <a href="anello-villalago.html">Anello di Villalago</a>
                <a href="milonia.html">Milonia</a>
                <a href="anello-sperone.html">Anello Sperone</a>
                <a href="fosso-san-giorgio.html">Anello Fosso San Giorgio</a>
            </div>
        </div>
    `;

    marsicaMarker.bindPopup(popupContent).openPopup();

    setTimeout(function() {
        map.flyTo([41.985, 13.730], 11, { duration: 2 });
    }, 1200);
</script>
</body>
</html>
