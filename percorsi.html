<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percorsi - Percorsi ODM</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('Ortona_2.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .home-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .home-btn img {
      width: 120px;
      height: auto;
      display: block;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
      }

      .home-btn {
        top: 10px;
        right: 10px;
      }

      .home-btn img {
        width: 80px;
      }
    }
  </style>
</head>

<body>

  <a href="index.html" class="home-btn">
    Torna_Home.png
  </a>

</body>
</html>
