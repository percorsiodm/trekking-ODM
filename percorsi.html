<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percorsi - Percorsi ODM</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('Ortona_2.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .home-btn img {
            width: 100px;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .home-btn img:hover {
            transform: scale(1.05);
        }
        .via-dei-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }
        .via-dei-btn img {
            width: 100px;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
            border-radius: 8px;
        }
        .via-dei-btn img:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
            .home-btn {
                top: 10px;
                right: 10px;
            }
            .home-btn img {
                width: 70px;
            }
            .via-dei-btn {
                top: 10px;
                left: 10px;
            }
            .via-dei-btn img {
                width: 70px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">
        <img src="Torna_Home.png" alt="Torna alla Home">
    </a>
    <a href="viadeglidei.html" class="via-dei-btn">
        <img src="Via%20degli%20dei%20Dei.png" alt="Via degli Dei">
    </a>
</body>
</html>
