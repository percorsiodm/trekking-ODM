<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventi - Percorsi ODM</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('ODM.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .home-btn img {
            width: 100px;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .home-btn img:hover {
            transform: scale(1.05);
        }
        .intro-text {
            text-align: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .intro-text p {
            display: inline-block;
            background: rgba(0,0,0,0.45);
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.3rem;
            padding: 16px 28px;
            border-radius: 10px;
            margin: 0;
            line-height: 1.5;
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
            .home-btn {
                top: 10px;
                right: 10px;
            }
            .home-btn img {
                width: 70px;
            }
            .intro-text p {
                font-size: 1.05rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">
        <img src="Trekking.jpg" alt="Torna alla Home">
    </a>
    <div class="intro-text">
        <p>Scopri gli eventi organizzati tra sentieri, natura e compagnia.</p>
    </div>
</body>
</html>
