<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Anello Fosso San Giorgio</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #1c2414;
        font-family: sans-serif;
        color: #fff;
        padding: 40px 20px;
        text-align: center;
    }
    h1 { margin-bottom: 30px; }
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
    }
    .gallery-grid img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        cursor: zoom-in;
        transition: transform 0.2s ease;
    }
    .gallery-grid img:hover {
        transform: scale(1.02);
    }
    .back-btn {
        display: inline-block;
        margin-top: 40px;
        color: #fff;
        text-decoration: none;
        background: #4a5c2f;
        padding: 12px 24px;
        border-radius: 30px;
    }
    .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
        padding: 20px;
        box-sizing: border-box;
    }
    .lightbox.active {
        display: flex;
    }
    .lightbox img {
        max-width: 100%;
        max-height: 90vh;
        border-radius: 8px;
        box-shadow: 0 10px 50px rgba(0,0,0,0.7);
    }
    .lightbox-close {
        position: fixed;
        top: 20px;
        right: 30px;
        font-size: 2.5rem;
        color: #fff;
        cursor: pointer;
        z-index: 2001;
        line-height: 1;
    }
</style>
</head>
<body>
    <h1>Gallery - Anello Fosso San Giorgio</h1>
    <div class="gallery-grid">
        <img src="Fosso_1.jpg" alt="Anello Fosso San Giorgio 1" onclick="openLightbox(this.src)">
        <img src="Fosso_2.jpg" alt="Anello Fosso San Giorgio 2" onclick="openLightbox(this.src)">
    </div>
    <a href="fosso-san-giorgio.html" class="back-btn">← Torna all'Anello Fosso San Giorgio</a>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="Immagine ingrandita">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>
</body>
</html>
